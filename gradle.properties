org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft / NeoForge
# 26.2 requires Java 25 (verified against Mojang's version manifest).
minecraft_version=26.2
minecraft_version_range=[26.2,26.3)
neo_version=26.2.0.88
neo_version_range=[26.2.0,)
loader_version_range=[4,)

# Parchment mappings are not published for 26.2 yet. Re-enable the block in
# build.gradle once https://maven.parchmentmc.org/org/parchmentmc/data/parchment-26.2/ exists.
# parchment_minecraft_version=26.2
# parchment_mappings_version=

# Mod metadata
mod_id=placitum
mod_name=Placitum
mod_license=MIT
mod_version=0.1.1
mod_group_id=com.syang.placitum
mod_authors=syang
# Keep this file pure ASCII. Gradle reads .properties as ISO-8859-1, so a non-ASCII
# character here lands mangled in neoforge.mods.toml and shows up in the mod list.
mod_description=Ring a bell and the village lights its streets, lays its roads, builds its houses and raises its walls - with vanilla villagers, one block at a time, and it tells you why when it stops.
mod_homepage=https://www.curseforge.com/minecraft/mc-mods/placitum

# CurseForge - numeric project ID from the mod's CurseForge page.
curseforge_project_id=1696659
