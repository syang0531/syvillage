name: Release

# Push a version tag (e.g. v0.1.0) to build the mod and publish it to CurseForge.
#   git tag v0.1.0
#   git push origin v0.1.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Turn the tag "v0.1.0" into the mod version "0.1.0" so the jar version always matches the tag.
      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew build -Pmod_version=${{ steps.version.outputs.version }}

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BODY=$(awk -v v="## $VERSION" '
            $0 ~ "^" v { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$BODY" ]; then
            BODY="Release ${{ github.ref_name }}. See https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish to CurseForge
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CHANGELOG: ${{ steps.changelog.outputs.body }}
          RELEASE_TYPE: release
        # CurseForgeGradle is not configuration-cache compatible, so disable it for this task only.
        run: ./gradlew publishCurseForge -Pmod_version=${{ steps.version.outputs.version }} --no-configuration-cache

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: ${{ steps.changelog.outputs.body }}
          files: build/libs/placitum-${{ steps.version.outputs.version }}.jar
